<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo de Flores Amarillas - Estilo Van Gogh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            background-color: #020204;
            color: #fef08a;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .font-vango-script {
            font-family: 'Pinyon Script', cursive;
        }

        .font-vango-title {
            font-family: 'Cinzel', serif;
        }

        /* Resplandor impresionista refinado para el encabezado */
        .vango-glow {
            text-shadow: 0 0 12px rgba(253, 224, 71, 0.5),
                         0 0 25px rgba(234, 179, 8, 0.4),
                         0 0 45px rgba(202, 138, 4, 0.3);
            animation: pulseGlow 5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 10px rgba(253, 224, 71, 0.4), 0 0 20px rgba(234, 179, 8, 0.3);
            }
            100% {
                text-shadow: 0 0 22px rgba(254, 240, 138, 0.85), 0 0 40px rgba(250, 204, 21, 0.65), 0 0 60px rgba(234, 179, 8, 0.45);
            }
        }

        .vignette-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(1, 1, 3, 0.92) 100%);
            pointer-events: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between items-center overflow-hidden">

    <!-- Viñeta exterior para ambiente de pintura al óleo -->
    <div class="vignette-overlay z-10"></div>

    <!-- Encabezado con mensaje especial -->
    <header class="z-20 text-center px-4 pt-5 sm:pt-8 md:pt-10 max-w-4xl mx-auto pointer-events-none select-none">
        <h1 class="font-vango-script text-4xl sm:text-6xl md:text-7xl lg:text-8xl text-amber-200 mb-1 vango-glow tracking-wide leading-tight">
            Feliz día de las flores amarillas, amor
        </h1>
        <p class="font-vango-title text-xs sm:text-sm md:text-base text-yellow-300/80 tracking-[0.3em] uppercase mt-1 sm:mt-2 drop-shadow-lg">
            ✦ no lo olvide ✦
        </p>
    </header>

    <!-- Indicador de interacción -->
    <div id="hint" class="z-20 text-amber-200/50 text-xs tracking-widest uppercase transition-opacity duration-1000 animate-pulse pointer-events-none mb-2 sm:mb-4">
        ✨ Acaricia el ramo de girasoles para encender su luz ✨
    </div>

    <!-- Canvas de pintura al óleo estilo Van Gogh -->
    <canvas id="vanGoghCanvas" class="absolute inset-0 w-full h-full z-0 cursor-pointer"></canvas>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('vanGoghCanvas');
            const ctx = canvas.getContext('2d');
            const hint = document.getElementById('hint');

            let width, height;
            let mouseX = 0;
            let mouseY = 0;
            let targetGlow = 0;
            let currentGlow = 0;
            let isHovered = false;

            // Paleta de colores inspirada en las obras célebres de Van Gogh
            const VAN_GOGH = {
                yellowBright: '#fef08a',
                yellowMid: '#facc15',
                yellowDeep: '#eab308',
                ochre: '#ca8a04',
                orangeWarm: '#ea580c',
                orangeDeep: '#c2410c',
                brownCenter: '#3a1303',
                brownDark: '#210a01',
                greenStem: '#4d7c0f',
                greenLeaf: '#3f6212',
                greenDark: '#1a3a0e',
                paperWrap: '#a16207',
                paperLight: '#d97706',
                ribbon: '#78350f'
            };

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            function updateMousePos(x, y) {
                mouseX = x;
                mouseY = y;

                const centerX = width / 2;
                const centerY = height * 0.58;
                const dist = Math.hypot(mouseX - centerX, mouseY - centerY);

                // Detección de proximidad al ramo completo
                if (dist < 280) {
                    if (!isHovered) {
                        isHovered = true;
                        hint.style.opacity = '0.1';
                    }
                } else {
                    if (isHovered) {
                        isHovered = false;
                        hint.style.opacity = '0.7';
                    }
                }
            }

            window.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            // Espirales dinámicas de fondo estilo 'La Noche Estrellada'
            class StarrySwirl {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height * 0.75;
                    this.radius = Math.random() * 45 + 15;
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = (Math.random() * 0.004 + 0.0015) * (Math.random() > 0.5 ? 1 : -1);
                    this.opacity = Math.random() * 0.12 + 0.04;
                }

                update() {
                    this.angle += this.speed;
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 1.4);
                    ctx.strokeStyle = `rgba(253, 224, 71, ${this.opacity * (1 + currentGlow * 0.6)})`;
                    ctx.lineWidth = Math.random() * 2 + 1;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Partículas de luz y pétalos flotantes estilo impasto
            class SparkleParticle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = width / 2 + (Math.random() - 0.5) * 420;
                    this.y = height * 0.58 + (Math.random() - 0.5) * 350;
                    this.length = Math.random() * 14 + 6;
                    this.angle = Math.random() * Math.PI * 2;
                    this.speedY = -Math.random() * 0.9 - 0.2;
                    this.speedX = (Math.random() - 0.5) * 0.7;
                    this.life = Math.random() * 110 + 50;
                    this.maxLife = this.life;
                    this.width = Math.random() * 3.5 + 1.2;
                    this.color = Math.random() > 0.35 ? VAN_GOGH.yellowBright : VAN_GOGH.yellowMid;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life--;
                    if (this.life <= 0) this.reset();
                }

                draw() {
                    const alpha = (this.life / this.maxLife) * (0.15 + currentGlow * 0.85);
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.width;
                    ctx.lineCap = 'round';
                    
                    ctx.beginPath();
                    ctx.moveTo(-this.length / 2, 0);
                    ctx.lineTo(this.length / 2, 0);
                    ctx.stroke();

                    if (currentGlow > 0.3) {
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#fef08a';
                    }
                    ctx.restore();
                }
            }

            const swirls = Array.from({ length: 22 }, () => new StarrySwirl());
            const sparkles = Array.from({ length: 80 }, () => new SparkleParticle());

            // Función auxiliar para realizar pinceladas fluidas con curvatura
            function drawBrushStroke(x1, y1, x2, y2, color, strokeWidth, curvature = 0) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x1, y1);

                if (curvature !== 0) {
                    const midX = (x1 + x2) / 2 + curvature;
                    const midY = (y1 + y2) / 2 + curvature;
                    ctx.quadraticCurveTo(midX, midY, x2, y2);
                } else {
                    ctx.lineTo(x2, y2);
                }

                ctx.strokeStyle = color;
                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.restore();
            }

            // Pincelada individual de pétalo de girasol
            function drawPainterlyPetal(cx, cy, angle, length, width, baseColor, tipColor, glow, seed) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                const curve = Math.sin(seed * 1.7) * 10;

                ctx.beginPath();
                ctx.moveTo(0, 10);
                ctx.quadraticCurveTo(width / 1.1 + curve, length * 0.45, curve / 2, length);
                ctx.quadraticCurveTo(-width / 1.1 + curve, length * 0.45, 0, 10);
                
                let grad = ctx.createLinearGradient(0, 0, 0, length);
                grad.addColorStop(0, baseColor);
                grad.addColorStop(0.75, tipColor);
                grad.addColorStop(1, glow > 0.4 ? '#ffffff' : tipColor);

                ctx.fillStyle = grad;
                ctx.fill();

                // Relief/Impasto Highlights
                drawBrushStroke(0, 12, curve / 3, length * 0.82, `rgba(254, 240, 138, ${0.35 + glow * 0.45})`, 2 + (seed % 2));
                drawBrushStroke(-width / 3.5, 15, curve / 2 - 2, length * 0.6, `rgba(194, 65, 12, 0.28)`, 1.5);

                ctx.restore();
            }

            // Dibuja una flor individual dentro del ramo
            function drawSingleSunflower(cx, cy, scale, glow, seed) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);

                // Halo de brillo individual por flor
                if (glow > 0.05) {
                    let halo = ctx.createRadialGradient(0, 0, 10, 0, 0, 110 + glow * 40);
                    halo.addColorStop(0, `rgba(254, 240, 138, ${0.25 * glow})`);
                    halo.addColorStop(0.5, `rgba(234, 179, 8, ${0.12 * glow})`);
                    halo.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = halo;
                    ctx.beginPath();
                    ctx.arc(0, 0, 110 + glow * 40, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Capas de pétalos
                const layers = [
                    { count: 22, len: 78, width: 16, color1: VAN_GOGH.orangeDeep, color2: VAN_GOGH.yellowDeep, offset: 0.1 },
                    { count: 24, len: 70, width: 17, color1: VAN_GOGH.ochre, color2: VAN_GOGH.yellowMid, offset: 0.0 },
                    { count: 20, len: 58, width: 15, color1: VAN_GOGH.yellowMid, color2: VAN_GOGH.yellowBright, offset: 0.25 }
                ];

                layers.forEach((layer) => {
                    for (let i = 0; i < layer.count; i++) {
                        const angle = (i * Math.PI * 2) / layer.count + layer.offset + seed;
                        drawPainterlyPetal(0, 0, angle, layer.len + glow * 10, layer.width, layer.color1, layer.color2, glow, i + seed);
                    }
                });

                // Centro de la flor
                const centerR = 34;
                ctx.beginPath();
                ctx.arc(0, 0, centerR + 2, 0, Math.PI * 2);
                ctx.fillStyle = VAN_GOGH.brownDark;
                ctx.fill();

                // Punteado concéntrico estilo Van Gogh
                for (let r = 5; r > 0; r--) {
                    const currentR = (r / 5) * centerR;
                    const dots = r * 8;
                    for (let i = 0; i < dots; i++) {
                        const a = (i * Math.PI * 2) / dots + r * 0.4;
                        const dx = Math.cos(a) * currentR;
                        const dy = Math.sin(a) * currentR;

                        ctx.beginPath();
                        ctx.arc(dx, dy, 2 + (r % 2), 0, Math.PI * 2);

                        if (glow > 0.3 && (i + r) % 3 === 0) {
                            ctx.fillStyle = VAN_GOGH.yellowBright;
                        } else if (r > 3) {
                            ctx.fillStyle = VAN_GOGH.brownCenter;
                        } else {
                            ctx.fillStyle = VAN_GOGH.ochre;
                        }
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            // Renderiza el ramo completo de girasoles con envoltorio y follaje
            function drawSunflowerBouquet(centerX, centerY, glow) {
                ctx.save();

                // 1. GRAN AURA AMBIENTAL PARA EL RAMO ENTERO
                if (glow > 0.01) {
                    let bouquetHaloR = 330 + glow * 110;
                    let radialGlow = ctx.createRadialGradient(
                        centerX, centerY - 20, 40,
                        centerX, centerY - 20, bouquetHaloR
                    );
                    radialGlow.addColorStop(0, `rgba(254, 240, 138, ${0.32 * glow})`);
                    radialGlow.addColorStop(0.4, `rgba(234, 179, 8, ${0.18 * glow})`);
                    radialGlow.addColorStop(0.85, `rgba(194, 65, 12, ${0.06 * glow})`);
                    radialGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    ctx.fillStyle = radialGlow;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY - 20, bouquetHaloR, 0, Math.PI * 2);
                    ctx.fill();

                    // Pinceladas circulares de luz rodeando el ramo
                    const outerStrokes = 32;
                    for (let i = 0; i < outerStrokes; i++) {
                        const angle = (i * Math.PI * 2) / outerStrokes + (Date.now() * 0.00025);
                        const dist = 220 + (i % 4) * 22;
                        const sx = centerX + Math.cos(angle) * dist;
                        const sy = (centerY - 30) + Math.sin(angle) * dist;
                        const ex = sx + Math.cos(angle + 0.35) * (25 + glow * 15);
                        const ey = sy + Math.sin(angle + 0.35) * (25 + glow * 15);

                        drawBrushStroke(sx, sy, ex, ey, `rgba(254, 240, 138, ${0.28 * glow})`, 2.5 + (i % 2));
                    }
                }

                // 2. TALLOS INFERIORES ASOMANDO
                const baseStemY = centerY + 280;
                drawBrushStroke(centerX - 15, centerY + 120, centerX - 25, baseStemY, VAN_GOGH.greenDark, 12, -10);
                drawBrushStroke(centerX, centerY + 120, centerX - 5, baseStemY + 10, VAN_GOGH.greenStem, 14, 5);
                drawBrushStroke(centerX + 15, centerY + 120, centerX + 20, baseStemY - 5, VAN_GOGH.greenDark, 10, 8);

                // 3. ENVOLTORIO DE PAPEL KRAFT ESTILO OLEO
                const wrapTopY = centerY + 60;
                const wrapBottomY = centerY + 220;

                ctx.beginPath();
                ctx.moveTo(centerX - 130, wrapTopY - 40);
                ctx.lineTo(centerX + 130, wrapTopY - 40);
                ctx.lineTo(centerX + 40, wrapBottomY);
                ctx.lineTo(centerX - 40, wrapBottomY);
                ctx.closePath();
                ctx.fillStyle = VAN_GOGH.paperWrap;
                ctx.fill();

                // Trazos de relieve en el envoltorio
                drawBrushStroke(centerX - 120, wrapTopY - 35, centerX - 35, wrapBottomY, VAN_GOGH.paperLight, 8, -15);
                drawBrushStroke(centerX + 120, wrapTopY - 35, centerX + 35, wrapBottomY, '#78350f', 8, 15);
                drawBrushStroke(centerX - 90, wrapTopY - 20, centerX + 90, wrapTopY - 20, VAN_GOGH.paperLight, 6);

                // Lazo/Cinta del ramo
                drawBrushStroke(centerX - 48, centerY + 145, centerX + 48, centerY + 145, VAN_GOGH.ribbon, 16);
                drawBrushStroke(centerX - 42, centerY + 145, centerX + 42, centerY + 145, VAN_GOGH.yellowMid, 4);

                // 4. HOJAS Y FOLLAJE VERDE ALREDEDOR DEL RAMO
                const leafPos = [
                    { x: centerX - 145, y: centerY - 40, angle: -Math.PI / 2.8 },
                    { x: centerX + 145, y: centerY - 30, angle: Math.PI / 2.8 },
                    { x: centerX - 170, y: centerY + 20, angle: -Math.PI / 4 },
                    { x: centerX + 160, y: centerY + 30, angle: Math.PI / 3.5 },
                    { x: centerX - 60, y: centerY - 140, angle: -Math.PI / 1.8 },
                    { x: centerX + 70, y: centerY - 135, angle: Math.PI / 1.8 }
                ];

                leafPos.forEach(leaf => {
                    ctx.save();
                    ctx.translate(leaf.x, leaf.y);
                    ctx.rotate(leaf.angle);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(30, -28, 85, 0);
                    ctx.quadraticCurveTo(30, 28, 0, 0);
                    ctx.fillStyle = VAN_GOGH.greenDark;
                    ctx.fill();
                    drawBrushStroke(0, 0, 70, 0, VAN_GOGH.greenStem, 3.5);
                    drawBrushStroke(12, -6, 50, -9, `rgba(250, 204, 21, ${0.35 + glow * 0.4})`, 2);
                    ctx.restore();
                });

                // 5. COMPOSICIÓN DEL RAMO (Múltiples girasoles ordenados armónicamente)
                const flowers = [
                    // Fondo/Atrás
                    { x: centerX - 85, y: centerY - 80, scale: 0.88, seed: 1.1 },
                    { x: centerX + 85, y: centerY - 75, scale: 0.85, seed: 2.3 },
                    { x: centerX, y: centerY - 110, scale: 0.92, seed: 0.5 },
                    // Centro/Frente
                    { x: centerX - 70, y: centerY, scale: 0.98, seed: 3.4 },
                    { x: centerX + 70, y: centerY + 5, scale: 0.96, seed: 4.2 },
                    { x: centerX, y: centerY - 25, scale: 1.15, seed: 5.0 }
                ];

                flowers.forEach(f => {
                    drawSingleSunflower(f.x, f.y, f.scale, glow, f.seed);
                });

                ctx.restore();
            }

            function animate() {
                // Suavizado (Lerp) para el resplandor interactivo
                targetGlow = isHovered ? 1 : 0;
                currentGlow += (targetGlow - currentGlow) * 0.045;

                // Fondo nocturno oscuro
                ctx.fillStyle = '#020204';
                ctx.fillRect(0, 0, width, height);

                // Espirales de fondo
                swirls.forEach(swirl => {
                    swirl.update();
                    swirl.draw();
                });

                const bouquetX = width / 2;
                const bouquetY = height * 0.54;

                // Dibujar ramo de girasoles
                drawSunflowerBouquet(bouquetX, bouquetY, currentGlow);

                // Partículas incandescentes subiendo por el lienzo
                sparkles.forEach(sparkle => {
                    sparkle.update();
                    sparkle.draw();
                });

                requestAnimationFrame(animate);
            }

            animate();
        };
    </script>
</body>
</html>
